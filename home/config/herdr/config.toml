else
  "${HERDR_BIN_PATH:-herdr}" plugin action invoke herdr-splits.nav-up >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
description = "resize left"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+alt+h
else
  "${HERDR_BIN_PATH:-herdr}" pane resize --pane "$pane" --direction left --amount 0.01 >/dev/null 2>&1
fi
'''

