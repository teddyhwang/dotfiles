key = "prefix+4"
type = "shell"
command = 'tab_id=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs | sort_by(.number) | .[4].tab_id // empty"); [ -z "$tab_id" ] || herdr tab focus "$tab_id"'

