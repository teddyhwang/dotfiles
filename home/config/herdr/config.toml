# tmux default: prefix+! break-pane
[[keys.command]]
key = "prefix+!"
type = "shell"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

# tmux: bind T break-pane
[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

# tmux default: prefix+x kill-pane
[[keys.command]]
key = "prefix+x"
type = "shell"
command = 'herdr pane close "$HERDR_ACTIVE_PANE_ID"'

# tmux: bind P paste-buffer
[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = 'herdr pane send-text "$HERDR_ACTIVE_PANE_ID" "$(pbpaste)"'

# tmux: bind b display-popup -E
[[keys.command]]
key = "prefix+b"
type = "pane"
command = '${SHELL:-/bin/sh}'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv|pi|opencode|claude)$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+j
else
  herdr plugin action invoke herdr-splits.nav-down >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv|pi|opencode|claude)$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+k
else
  herdr plugin action invoke herdr-splits.nav-up >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "ctrl+alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "ctrl+alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

# tmux: bind -n C-x if-shell "$is_vim" "send-keys C-x" "send-keys C-l"
[[keys.command]]
key = "ctrl+x"
type = "shell"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+x
else
  herdr pane send-keys "$pane" ctrl+l
fi
'''
