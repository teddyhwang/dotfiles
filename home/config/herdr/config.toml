onboarding = false

[experimental]
switch_ascii_input_source_in_prefix = false
# Save recent pane screen history across full server restarts.
pane_history = true

[advanced]
# Per-pane scrollback buffer in bytes (default 10MB, Ghostty parity).
# Raised to 100MB so long agent sessions keep their full history and
# can scroll back to the top without dropping early output.
scrollback_limit_bytes = 104857600

[ui]
show_agent_labels_on_pane_borders = true

# Tab labels are filled in by home/local/bin/herdr-tab-autoname (started from
# hypr/autostart.lua on Linux, apps/herdr-tab-autoname.plist on macOS): agent
# topic when the agent reports one, else repo and branch. Naming a tab by hand
# -- at the new-tab prompt or with prefix+A -- opts that tab out; renaming it
# back to a bare number opts it back in.

agent_panel_sort = "spaces"
[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Keybindings mirroring my tmux config (prefix C-a).
[keys]
prefix = "ctrl+a"

# Panes
split_horizontal = "prefix+minus"  # tmux: bind - split-window -v (top/bottom)
split_vertical = "prefix+|"        # tmux: bind | split-window -h (side by side)
copy_mode = "prefix+["             # tmux: bind [ copy-mode
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+o"        # tmux default: select next pane
last_pane = "prefix+tab"            # tmux: bind Tab last-pane
close_pane = "prefix+q"             # tmux: bind q killp
zoom = "prefix+z"
resize_mode = "prefix+e"            # tmux: bind e switch-client -T resize
edit_scrollback = "prefix+shift+e"
rename_pane = "prefix+shift+r"      # prefix+P stays available for tmux paste-buffer
toggle_sidebar = 'prefix+\'

# Tabs / windows
new_tab = "prefix+c"                # tmux: bind c new-window
rename_tab = "prefix+shift+a"       # tmux: bind A rename-window
# Keep frequent tab navigation native: shell-backed bindings add noticeable
# cold-start latency before the first switch.
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]
move_tab_previous = "prefix+shift+comma"   # prefix+<: move tab left
move_tab_next = "prefix+shift+period"      # prefix+>: move tab right
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"      # tmux default: prefix+&

# Workspaces / sessions
goto = "prefix+shift+s"             # tmux: bind S sessions + windows popup
workspace_picker = "prefix+w"       # tmux: bind w choose-tree -Zs
switch_workspace = ""
rename_workspace = "prefix+$"       # tmux default: rename-session
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Misc
settings = "prefix+shift+c"         # tmux default: customize-mode
open_notification_target = "prefix+~"  # tmux default: show-messages
detach = "prefix+d"                 # tmux default: prefix+d
reload_config = "prefix+r"          # tmux: bind r source-file
help = "prefix+?"

[[keys.command]]
key = "prefix+shift+v"
type = "popup"
description = "join pane"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
sel=$(herdr pane list | jq -r --arg ws "$HERDR_ACTIVE_WORKSPACE_ID" --arg tab "$HERDR_ACTIVE_TAB_ID" '.result.panes[] | select(.workspace_id == $ws and .tab_id != $tab) | "\(.pane_id)\t\(.agent // "shell")\t\(.cwd)"' | fzf --delimiter='\t' --with-nth=2.. --reverse --prompt='join pane> ' | cut -f1)
[ -n "$sel" ] && herdr pane move "$sel" --tab "$HERDR_ACTIVE_TAB_ID" --split right --focus >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+="
type = "shell"
description = "even out pane sizes"
command = 'herdr-even-layout'

[[keys.command]]
key = "prefix+a"
type = "popup"
description = "switch agent"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
sel=$(jq -rn --argjson ws "$(herdr workspace list | jq -c '.result.workspaces')" --argjson ag "$(herdr agent list | jq -c '.result.agents')" '($ws | map({key: .workspace_id, value: .label}) | from_entries) as $labels | $ag[] | "\(.pane_id)\t\(if .focused then "\u2192" else " " end) \($labels[.workspace_id] // .workspace_id)  \(.agent)  \(.agent_status)  \(.terminal_title_stripped // "")"' | fzf --delimiter='\t' --with-nth=2.. --reverse --no-sort --prompt='agent> ' | cut -f1)
[ -n "$sel" ] && herdr agent focus "$sel" >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+s"
type = "popup"
description = "switch workspace"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
sel=$(herdr workspace list | jq -r '.result.workspaces[] | "\(.workspace_id)\t\(if .focused then "\u2192" else " " end) \(.label)  \(.tab_count) tab\(if .tab_count == 1 then "" else "s" end), \(.pane_count) pane\(if .pane_count == 1 then "" else "s" end)\(if .agent_status == "unknown" then "" else "  " + .agent_status end)"' | fzf --delimiter='\t' --with-nth=2.. --reverse --no-sort --prompt='workspace> ' | cut -f1)
[ -n "$sel" ] && herdr workspace focus "$sel" >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
description = "break pane to new tab"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
description = "break pane to new tab"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+x"
type = "shell"
description = "kill pane"
command = 'herdr pane close "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
description = "paste buffer"
command = 'herdr pane send-text "$HERDR_ACTIVE_PANE_ID" "$(pbpaste)"'

[[keys.command]]
key = "prefix+b"
type = "pane"
description = "popup shell"
command = '${SHELL:-/bin/sh}'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
description = "navigate left"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
description = "navigate right"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+j"
type = "shell"
description = "navigate down"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+j
else
  herdr plugin action invoke herdr-splits.nav-down >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+k"
type = "shell"
description = "navigate up"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+k
else
  herdr plugin action invoke herdr-splits.nav-up >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
description = "resize left"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+alt+h
else
  herdr pane resize --pane "$pane" --direction left --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
description = "resize down"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+alt+j
else
  herdr pane resize --pane "$pane" --direction down --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
description = "resize up"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+alt+k
else
  herdr pane resize --pane "$pane" --direction up --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
description = "resize right"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+alt+l
else
  herdr pane resize --pane "$pane" --direction right --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+x"
type = "shell"
description = "clear screen"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if herdr pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  herdr pane send-keys "$pane" ctrl+x
else
  herdr pane send-keys "$pane" ctrl+l
fi
'''
