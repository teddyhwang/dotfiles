description = "select tab 9"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:10"'

[[keys.command]]
key = "prefix+shift+v"
type = "popup"
description = "join pane"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
sel=$("${HERDR_BIN_PATH:-herdr}" pane list | jq -r --arg ws "$HERDR_ACTIVE_WORKSPACE_ID" --arg tab "$HERDR_ACTIVE_TAB_ID" '.result.panes[] | select(.workspace_id == $ws and .tab_id != $tab) | "\(.pane_id)\t\(.agent // "shell")\t\(.cwd)"' | fzf --delimiter='\t' --with-nth=2.. --reverse --prompt='join pane> ' | cut -f1)
[ -n "$sel" ] && "${HERDR_BIN_PATH:-herdr}" pane move "$sel" --tab "$HERDR_ACTIVE_TAB_ID" --split right --focus >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+="
type = "shell"
description = "even out pane sizes"
command = 'herdr-even-layout'

[[keys.command]]
key = "prefix+a"
type = "popup"
description = "switch agent"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
# Herdr 0.9.0's agent focus updates server state without moving the attached
# client's viewport (herdrdev/herdr#3760). The raw pane.focus method still
# projects to the client and also selects the exact pane in a split tab.
sel=$(jq -rn --argjson ws "$("${HERDR_BIN_PATH:-herdr}" workspace list | jq -c '.result.workspaces')" --argjson ag "$("${HERDR_BIN_PATH:-herdr}" agent list | jq -c '.result.agents')" '($ws | map({key: .workspace_id, value: .label}) | from_entries) as $labels | $ag[] | "\(.pane_id)\t\(if .focused then "\u2192" else " " end) \($labels[.workspace_id] // .workspace_id)  \(.agent)  \(.agent_status)  \(.terminal_title_stripped // "")"' | fzf --delimiter='\t' --with-nth=2.. --reverse --no-sort --prompt='agent> ' | cut -f1)
[ -n "$sel" ] && "$HOME/.local/bin/herdr-focus-pane" "$sel" >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+s"
type = "popup"
description = "switch workspace"
width = "70%"
height = "50%"
command = '''
TINTY_FZF="$HOME/.local/share/tinted-theming/tinty/tinted-fzf-sh-file.sh"
[ -f "$TINTY_FZF" ] && . "$TINTY_FZF"
sel=$("${HERDR_BIN_PATH:-herdr}" workspace list | jq -r '.result.workspaces[] | "\(.workspace_id)\t\(if .focused then "\u2192" else " " end) \(.label)  \(.tab_count) tab\(if .tab_count == 1 then "" else "s" end), \(.pane_count) pane\(if .pane_count == 1 then "" else "s" end)\(if .agent_status == "unknown" then "" else "  " + .agent_status end)"' | fzf --delimiter='\t' --with-nth=2.. --reverse --no-sort --prompt='workspace> ' | cut -f1)
[ -n "$sel" ] && "${HERDR_BIN_PATH:-herdr}" workspace focus "$sel" >/dev/null 2>&1
'''

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
description = "break pane to new tab"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
description = "break pane to new tab"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+x"
type = "shell"
description = "kill pane"
command = '"${HERDR_BIN_PATH:-herdr}" pane close "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
description = "paste buffer"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-text "$HERDR_ACTIVE_PANE_ID" "$(pbpaste)"'

[[keys.command]]
key = "prefix+b"
type = "pane"
description = "popup shell"
command = '${SHELL:-/bin/sh}'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
description = "navigate left"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
description = "navigate right"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+j"
type = "shell"
description = "navigate down"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+j
else
  "${HERDR_BIN_PATH:-herdr}" plugin action invoke herdr-splits.nav-down >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+k"
type = "shell"
description = "navigate up"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
