onboarding = false

[terminal]
# Pi emits Kitty graphics when it detects the outer Ghostty terminal. Herdr
# must decode and render those images instead of consuming the payload.
# Restart the server or reattach the client after changing this setting.
kitty_graphics = true

[experimental]
switch_ascii_input_source_in_prefix = false
# Save recent pane screen history across full server restarts.
pane_history = true

[advanced]
# Per-pane scrollback buffer in bytes (default 10MB, Ghostty parity).
# Raised to 100MB so long agent sessions keep their full history and
# can scroll back to the top without dropping early output.
scrollback_limit_bytes = 104857600

[ui]
show_agent_labels_on_pane_borders = true
# Herdr's creation prompt suggests its native one-based position. Skip it and
# let the tab-autoname plugin assign the zero-based label after creation.
prompt_new_tab_name = false

# The teddyhwang.tab-autoname Herdr plugin invokes a transient naming worker
# after tab, pane, and agent events. Every label starts with its zero-based
# position in the workspace, like tmux:
# `0:name`. This matches the number used by prefix+0..9 and is recomputed after
# tabs move or close. The name is the agent topic when available, else repo and
# branch. Naming a tab by hand -- at the new-tab prompt or with prefix+A -- opts
# its name out; renaming it back to a bare number opts it back in.

agent_panel_sort = "spaces"
[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Keybindings mirroring my tmux config (prefix C-a).
[keys]
prefix = "ctrl+a"

# Panes
split_horizontal = "prefix+minus"  # tmux: bind - split-window -v (top/bottom)
split_vertical = "prefix+|"        # tmux: bind | split-window -h (side by side)
copy_mode = "prefix+["             # tmux: bind [ copy-mode
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+o"        # tmux default: select next pane
last_pane = "prefix+tab"            # tmux: bind Tab last-pane
close_pane = "prefix+q"             # tmux: bind q killp
zoom = "prefix+z"
resize_mode = "prefix+e"            # tmux: bind e switch-client -T resize
edit_scrollback = "prefix+shift+e"
rename_pane = "prefix+shift+r"      # prefix+P stays available for tmux paste-buffer
toggle_sidebar = 'prefix+\'

# Tabs / windows
new_tab = "prefix+c"                # tmux: bind c new-window
rename_tab = "prefix+shift+a"       # tmux: bind A rename-window
# Keep frequent tab navigation native: shell-backed bindings add noticeable
# cold-start latency before the first switch.
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]
move_tab_previous = "prefix+shift+comma"   # prefix+<: move tab left
move_tab_next = "prefix+shift+period"      # prefix+>: move tab right
# Native indexed bindings only support 1..9. The direct positional commands
# below provide zero-based prefix+0..9 without listing or sorting tabs.
switch_tab = ""
close_tab = "prefix+ampersand"      # tmux default: prefix+&

# Workspaces / sessions
goto = "prefix+shift+s"             # tmux: bind S sessions + windows popup
workspace_picker = "prefix+w"       # tmux: bind w choose-tree -Zs
switch_workspace = ""
rename_workspace = "prefix+$"       # tmux default: rename-session
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Misc
settings = "prefix+shift+c"         # tmux default: customize-mode
open_notification_target = "prefix+~"  # tmux default: show-messages
detach = "prefix+d"                 # tmux default: prefix+d
reload_config = "prefix+r"          # tmux: bind r source-file
help = "prefix+?"

# Use the running server's CLI for custom commands. Login-shell PATH can
# otherwise select an older Homebrew installation and fail with protocol_mismatch.
# Herdr's `workspace:position` target is one-based even though these keys and
# displayed tab indexes are zero-based.
[[keys.command]]
key = "prefix+0"
type = "shell"
description = "select tab 0"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:1"'

[[keys.command]]
key = "prefix+1"
type = "shell"
description = "select tab 1"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:2"'

[[keys.command]]
key = "prefix+2"
type = "shell"
description = "select tab 2"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:3"'

[[keys.command]]
key = "prefix+3"
type = "shell"
description = "select tab 3"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:4"'

