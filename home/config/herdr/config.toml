onboarding = false

[terminal]
# Pi emits Kitty graphics when it detects the outer Ghostty terminal. Herdr
# must decode and render those images instead of consuming the payload.
# Restart the server or reattach the client after changing this setting.
kitty_graphics = true

[experimental]
switch_ascii_input_source_in_prefix = false
# Save recent pane screen history across full server restarts.
pane_history = true

[advanced]
# Per-pane scrollback buffer in bytes (default 10MB, Ghostty parity).
# Raised to 100MB so long agent sessions keep their full history and
# can scroll back to the top without dropping early output.
scrollback_limit_bytes = 104857600

[ui]
show_agent_labels_on_pane_borders = true
# Herdr's creation prompt suggests its native one-based position. Skip it and
# let the tab-autoname plugin assign the zero-based label after creation.
prompt_new_tab_name = false

# The teddyhwang.tab-autoname Herdr plugin invokes a transient naming worker
# after tab, pane, and agent events. Every label starts with its zero-based
# position in the workspace, like tmux:
# `0:name`. This matches the number used by prefix+0..9 and is recomputed after
# tabs move or close. The name is the agent topic when available, else repo and
# branch. Naming a tab by hand -- at the new-tab prompt or with prefix+A -- opts
# its name out; renaming it back to a bare number opts it back in.
# In a monorepo checkout such as shop/world, the repo name is the innermost tec
# zone (the nearest directory with zone.nix), not the checkout root `src`. The
# plugin also renames such workspaces after that zone; a workspace named by hand
# with prefix+$ keeps its name.

# Herdr's priority sort orders the sidebar and prefix+alt+j/k: blocked, done
# (finished, not yet seen), working, then idle, newest state change first. Its
# order is fixed, and a plugin agent view that reorders it would disable the
# sidebar's grouped/priority toggle. The toggle saves a client preference that
# overrides this setting. The prefix+a picker puts every finished agent (done,
# then idle) above working ones instead.
agent_panel_sort = "priority"
[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "herdr"

# Keybindings mirroring my tmux config (prefix C-a).
[keys]
prefix = "ctrl+a"

# Panes
split_horizontal = "prefix+minus"  # tmux: bind - split-window -v (top/bottom)
split_vertical = "prefix+|"        # tmux: bind | split-window -h (side by side)
copy_mode = "prefix+["             # tmux: bind [ copy-mode
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = "prefix+o"        # tmux default: select next pane
last_pane = "prefix+tab"            # tmux: bind Tab last-pane
close_pane = "prefix+q"             # tmux: bind q killp
zoom = "prefix+z"
resize_mode = "prefix+e"            # tmux: bind e switch-client -T resize
edit_scrollback = "prefix+shift+e"
rename_pane = "prefix+shift+r"      # prefix+P stays available for tmux paste-buffer
toggle_sidebar = 'prefix+\'

# Tabs / windows
new_tab = "prefix+c"                # tmux: bind c new-window
rename_tab = "prefix+shift+a"       # tmux: bind A rename-window
# Keep frequent tab navigation native: shell-backed bindings add noticeable
# cold-start latency before the first switch.
previous_tab = ["prefix+p", "prefix+ctrl+h"]
next_tab = ["prefix+n", "prefix+ctrl+l"]
move_tab_previous = "prefix+shift+comma"   # prefix+<: move tab left
move_tab_next = "prefix+shift+period"      # prefix+>: move tab right
# Native indexed bindings only support 1..9. The direct positional commands
# below provide zero-based prefix+0..9 without listing or sorting tabs.
switch_tab = ""
close_tab = "prefix+ampersand"      # tmux default: prefix+&

# Workspaces / sessions
goto = "prefix+shift+s"             # tmux: bind S sessions + windows popup
workspace_picker = "prefix+w"       # tmux: bind w choose-tree -Zs
switch_workspace = ""
rename_workspace = "prefix+$"       # tmux default: rename-session
# Worktrees: lowercase picks, uppercase creates, X deletes (D only closes).
# prefix+g opens the fzf worktree picker below; the native picker only moves
# with the arrow keys and would take precedence over keys.command if bound.
open_worktree = ""
new_worktree = "prefix+shift+g"     # herdr default, pinned explicitly
remove_worktree = "prefix+shift+x"  # git worktree remove; never deletes the branch
previous_workspace = "prefix+ctrl+k"
next_workspace = "prefix+ctrl+j"
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# Misc
settings = "prefix+shift+c"         # tmux default: customize-mode
open_notification_target = "prefix+~"  # tmux default: show-messages
detach = "prefix+d"                 # tmux default: prefix+d
reload_config = "prefix+r"          # tmux: bind r source-file
help = "prefix+?"

# Use the running server's CLI for custom commands. Login-shell PATH can
# otherwise select an older Homebrew installation and fail with protocol_mismatch.
# Herdr's `workspace:position` target is one-based even though these keys and
# displayed tab indexes are zero-based.
[[keys.command]]
key = "prefix+0"
type = "shell"
description = "select tab 0"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:1"'

[[keys.command]]
key = "prefix+1"
type = "shell"
description = "select tab 1"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:2"'

[[keys.command]]
key = "prefix+2"
type = "shell"
description = "select tab 2"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:3"'

[[keys.command]]
key = "prefix+3"
type = "shell"
description = "select tab 3"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:4"'

[[keys.command]]
key = "prefix+4"
type = "shell"
description = "select tab 4"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:5"'

[[keys.command]]
key = "prefix+5"
type = "shell"
description = "select tab 5"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:6"'

[[keys.command]]
key = "prefix+6"
type = "shell"
description = "select tab 6"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:7"'

[[keys.command]]
key = "prefix+7"
type = "shell"
description = "select tab 7"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:8"'

[[keys.command]]
key = "prefix+8"
type = "shell"
description = "select tab 8"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:9"'

[[keys.command]]
key = "prefix+9"
type = "shell"
description = "select tab 9"
command = 'exec "${HERDR_BIN_PATH:-herdr}" tab focus "$HERDR_ACTIVE_WORKSPACE_ID:10"'

# The fzf pickers live in the teddyhwang.pickers plugin (plugins/herdr-pickers).
# Plugin popups get a titled border and are styled like Herdr's own pickers;
# keys.command popups are always labelled "popup".
[[keys.command]]
key = "prefix+shift+v"
type = "shell"
description = "join pane"
command = 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin teddyhwang.pickers --entrypoint join-pane'

[[keys.command]]
key = "prefix+="
type = "shell"
description = "even out pane sizes"
command = 'herdr-even-layout'

[[keys.command]]
key = "prefix+a"
type = "shell"
description = "switch agent"
command = 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin teddyhwang.pickers --entrypoint agent'

[[keys.command]]
key = "prefix+s"
type = "shell"
description = "switch workspace"
command = 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin teddyhwang.pickers --entrypoint workspace'

[[keys.command]]
key = "prefix+g"
type = "shell"
description = "open worktree"
command = 'exec "${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin teddyhwang.pickers --entrypoint worktree'

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
description = "break pane to new tab"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
description = "break pane to new tab"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

[[keys.command]]
key = "prefix+x"
type = "shell"
description = "kill pane"
command = '"${HERDR_BIN_PATH:-herdr}" pane close "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+p"
type = "shell"
description = "paste buffer"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-text "$HERDR_ACTIVE_PANE_ID" "$(pbpaste)"'

[[keys.command]]
key = "prefix+b"
type = "pane"
description = "popup shell"
command = '${SHELL:-/bin/sh}'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
description = "navigate left"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
description = "navigate right"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+j"
type = "shell"
description = "navigate down"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+j
else
  "${HERDR_BIN_PATH:-herdr}" plugin action invoke herdr-splits.nav-down >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+k"
type = "shell"
description = "navigate up"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0, .name)] | map(select(. != null) | sub(".*/"; "")) | any(test("^(fzf|atuin|tv)$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+k
else
  "${HERDR_BIN_PATH:-herdr}" plugin action invoke herdr-splits.nav-up >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
description = "resize left"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+alt+h
else
  "${HERDR_BIN_PATH:-herdr}" pane resize --pane "$pane" --direction left --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
description = "resize down"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+alt+j
else
  "${HERDR_BIN_PATH:-herdr}" pane resize --pane "$pane" --direction down --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
description = "resize up"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+alt+k
else
  "${HERDR_BIN_PATH:-herdr}" pane resize --pane "$pane" --direction up --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
description = "resize right"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+alt+l
else
  "${HERDR_BIN_PATH:-herdr}" pane resize --pane "$pane" --direction right --amount 0.01 >/dev/null 2>&1
fi
'''

[[keys.command]]
key = "ctrl+x"
type = "shell"
description = "clear screen"
command = '''
pane="$HERDR_ACTIVE_PANE_ID"
if "${HERDR_BIN_PATH:-herdr}" pane process-info --pane "$pane" | jq -e '[.result.process_info.foreground_processes[]? | (.argv0 // .name // "") | sub(".*/"; "")] | any(test("^g?(view|n?vim?)(diff)?$"))' >/dev/null 2>&1; then
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+x
else
  "${HERDR_BIN_PATH:-herdr}" pane send-keys "$pane" ctrl+l
fi
'''
