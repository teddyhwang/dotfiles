key = "prefix+5"
type = "shell"
command = 'tab_id=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs | sort_by(.number) | .[5].tab_id // empty"); [ -z "$tab_id" ] || herdr tab focus "$tab_id"'

[[keys.command]]
key = "prefix+6"
type = "shell"
command = 'tab_id=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs | sort_by(.number) | .[6].tab_id // empty"); [ -z "$tab_id" ] || herdr tab focus "$tab_id"'

[[keys.command]]
key = "prefix+7"
type = "shell"
command = 'tab_id=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs | sort_by(.number) | .[7].tab_id // empty"); [ -z "$tab_id" ] || herdr tab focus "$tab_id"'

[[keys.command]]
key = "prefix+8"
type = "shell"
command = 'tab_id=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r ".result.tabs | sort_by(.number) | .[8].tab_id // empty"); [ -z "$tab_id" ] || herdr tab focus "$tab_id"'

