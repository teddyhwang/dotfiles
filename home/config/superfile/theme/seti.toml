# Seti UI — the same Base16 palette as tinty's base16-seti.
# Palette: https://github.com/tinted-theming/schemes/blob/spec-0.11/base16/seti.yaml
# Superfile theme format: https://superfile.dev/configure/custom-theme/

# Used only when code_previewer is switched from bat to built-in Chroma.
# Chroma has no Seti style; bat uses our existing base16-256 configuration.
code_syntax_highlight = "base16-snazzy"

# Full screen (base05 foreground, base00 background)
full_screen_fg = "#d6d6d6"
full_screen_bg = "#151718"

# Blue and violet accents (base0D, base0E)
gradient_color = ["#55b5db", "#a074c4"]
directory_icon_color = "#55b5db"

# File panel
file_panel_fg = "#d6d6d6"
file_panel_bg = "#151718"
file_panel_border = "#41535b"
file_panel_border_active = "#55b5db"
file_panel_top_directory_icon = "#55b5db"
file_panel_top_path = "#55dbbe"
file_panel_item_selected_fg = "#9fca56"
file_panel_item_selected_bg = "#282a2b"

# Footer
footer_fg = "#d6d6d6"
footer_bg = "#151718"
footer_border = "#41535b"
footer_border_active = "#55b5db"

# Sidebar
sidebar_fg = "#d6d6d6"
sidebar_bg = "#151718"
sidebar_title = "#a074c4"
sidebar_border = "#41535b"
sidebar_border_active = "#55b5db"
sidebar_item_selected_fg = "#9fca56"
sidebar_item_selected_bg = "#282a2b"
sidebar_divider = "#41535b"

# Modals
modal_fg = "#d6d6d6"
modal_bg = "#151718"
modal_border_active = "#55b5db"
modal_cancel_fg = "#d6d6d6"
modal_cancel_bg = "#282a2b"
modal_confirm_fg = "#151718"
modal_confirm_bg = "#55b5db"

# Help menu
help_menu_hotkey = "#e6cd69"
help_menu_title = "#a074c4"

# Feedback
cursor = "#55dbbe"
correct = "#9fca56"
error = "#cd3f45"
hint = "#55b5db"
cancel = "#db7b55"
