shell = "zsh -c '{}'"
default-scheme = "base16-seti"

[[items]]
path = "https://github.com/tinted-theming/tinted-terminal"
name = "tinted-terminal"
themes-dir = "themes/ghostty"
# `tinty init` runs for every new interactive shell. Reload Ghostty only when
# the generated theme actually changed, rather than on every terminal startup.
hook = '''
destination="$HOME/.config/ghostty/themes/tinted-theming"
if ! cmp -s "$TINTY_THEME_FILE_PATH" "$destination"; then
  command cp -f "$TINTY_THEME_FILE_PATH" "$destination"
  killall -SIGUSR2 ghostty 2>/dev/null || true
fi
'''
supported-systems = ["base16", "base24"]

[[items]]
name = "tinted-fzf"
path = "https://github.com/tinted-theming/tinted-fzf"
supported-systems = ["base16", "base24"]
hook = ". %f"
themes-dir = "sh"

[[items]]
name = "base16-btop"
path = "https://git.sr.ht/~blueingreen/base16-btop"
themes-dir = "colors"
supported-systems = ["base16"]
hook = "command ln -snf %f ~/.config/btop/themes/current.theme && pkill -SIGUSR2 btop"

[[items]]
name = "tinted-shell"
path = "https://github.com/tinted-theming/tinted-shell"
themes-dir = "scripts"
supported-systems = ["base16", "base24"]
hook = ". %f && tinty-herdr-hook %f"

[[items]]
name = "base16-opencode"
path = "https://github.com/scaryrawr/base16-opencode"
themes-dir = "themes"
supported-systems = ["base16", "base24"]
hook = 'tinty-opencode-hook %f'

[[items]]
name = "tinted-zed"
path = "https://github.com/tinted-theming/tinted-zed"
themes-dir = "themes"
supported-systems = ["base16", "base24"]
hook = "cp -f \"$TINTY_THEME_FILE_PATH\" ~/.config/zed/themes/"
